; Rush LED Wall — PlatformIO project
; Board: Waveshare ESP32-S3-RGB-Matrix (ESP32-S3-N32R16: 32MB flash, 16MB octal PSRAM)

[env:waveshare-esp32s3-rgbmatrix]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Match the actual chip on the Waveshare board (32MB flash / 16MB octal PSRAM) ---
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_build.arduino.memory_type = opi_opi
board_build.psram_type = opi

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.11
    adafruit/Adafruit GFX Library @ ^1.11.9

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
